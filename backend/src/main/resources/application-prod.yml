# =========================================================================
# HireSense AI - Production Configuration Profile (SPRING_PROFILES_ACTIVE=prod)
# =========================================================================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      pool-name: HireSenseProdHikariPool
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    clean-disabled: true

hiresense:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000} # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  ai:
    provider: ${AI_PROVIDER:mock} # 'mock' or 'gemini'
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-1.5-flash}
  admin:
    initial:
      auto-create: ${ADMIN_AUTO_CREATE:false}
      email: ${INITIAL_ADMIN_EMAIL:admin@hiresense.ai}
      password: ${INITIAL_ADMIN_PASSWORD:}
      first-name: System
      last-name: Administrator
  storage:
    type: ${STORAGE_TYPE:local} # 'local' or 's3'
    location: ${STORAGE_LOCATION:storage/resumes}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      roles: ROLE_ADMIN
    info:
      enabled: true

logging:
  level:
    root: WARN
    com.hiresense: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
    org.hibernate: ERROR

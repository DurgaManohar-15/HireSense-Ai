# =========================================================================
# HireSense AI - Production Configuration Profile (SPRING_PROFILES_ACTIVE=prod)
# =========================================================================
server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://${MYSQLHOST:mysql.railway.internal}:${MYSQLPORT:3306}/${MYSQLDATABASE:railway}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:${MYSQLUSER:root}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:}}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      pool-name: HireSenseProdHikariPool
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    clean-disabled: true

hiresense:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000} # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.vercel.app}
  ai:
    provider: ${AI_PROVIDER:gemini} # 'gemini' or 'mock'
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-1.5-flash}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:62941711068-c5b0f2nefg19kat677p00dnf5j4r7o9m.apps.googleusercontent.com}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:https://hiresense-ai-production-2ea510c0.up.railway.app/api/v1/auth/google/callback}
      frontend-redirect-url: ${FRONTEND_URL:https://*.vercel.app/auth/callback}
      frontend-login-url: ${FRONTEND_LOGIN_URL:https://*.vercel.app/login}
  admin:
    initial:
      auto-create: ${ADMIN_AUTO_CREATE:true}
      email: ${INITIAL_ADMIN_EMAIL:admin@hiresense.ai}
      password: ${INITIAL_ADMIN_PASSWORD:Admin@HireSense2026}
      first-name: System
      last-name: Administrator
  storage:
    type: ${STORAGE_TYPE:local} # 'local' or 's3'
    location: ${STORAGE_LOCATION:storage/resumes}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      roles: ROLE_ADMIN
    info:
      enabled: true

logging:
  level:
    root: WARN
    com.hiresense: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
    org.hibernate: ERROR

# =========================================================================
# HireSense AI - Zero-Dependency Local Profile (SPRING_PROFILES_ACTIVE=local)
# Uses local persistent H2 database in MySQL compatibility mode with Flyway
# =========================================================================
server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    url: jdbc:h2:file:./storage/data/hiresense_local;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false # H2 DDL managed by Hibernate in local standalone mode
  h2:
    console:
      enabled: true
      path: /h2-console

hiresense:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  ai:
    provider: ${AI_PROVIDER:mock}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-1.5-flash}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
      frontend-redirect-url: ${FRONTEND_URL:http://localhost:5173/auth/callback}
      frontend-login-url: ${FRONTEND_LOGIN_URL:http://localhost:5173/login}
  admin:
    initial:
      auto-create: true
      email: admin@hiresense.ai
      password: Admin@HireSense2026
      first-name: System
      last-name: Administrator
  storage:
    type: local
    location: storage/resumes

logging:
  level:
    com.hiresense: INFO
    org.springframework.security: INFO
